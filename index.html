<!DOCTYPE html>
<html>
<head>
  <title>US Airports Map</title>
  <meta charset="utf-8" />
  <style>
    #map { height: 600px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <h2>US Airports Map</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

  <script>
    // Initialize the map centered on the US
    const map = L.map('map').setView([37.8, -96], 4);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Load CSV and create markers and a line
    Papa.parse('airports.csv', {
      header: true,
      download: true,
      complete: function(results) {
        console.log(results.data); // Debug

        const airportCoords = [];

        results.data.forEach(row => {
          const lat = parseFloat(row.LATITUDE);
          const lon = parseFloat(row.LONGITUDE);
          const name = row.AIRPORT;
          const city = row.CITY;
          const state = row.STATE;

          if (!isNaN(lat) && !isNaN(lon)) {
            // Add marker
            L.marker([lat, lon]).addTo(map)
              .bindPopup(`<b>${name}</b><br>${city}, ${state}`);

            // Collect coordinate
            airportCoords.push([lat, lon]);
          }
        });

        // Draw polyline connecting all airports
        L.polyline(airportCoords, {color: 'red'}).addTo(map);
      }
    });
  </script>
</body>
</html>
